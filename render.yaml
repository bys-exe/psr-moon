# Render Blueprint — one-click backend deploy.
# Dashboard → New → Blueprint → select the psr-moon repo.
# When prompted, set CORS_EXTRA_ORIGINS to your frontend URL, e.g.
# https://psr-moon.vercel.app (comma-separated if more than one).
services:
  - type: web
    name: psr-moon-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_EXTRA_ORIGINS
        sync: false
